<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Premium Shop</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <h1 class="logo">AI Shop ✨</h1>

    <input
      type="text"
      id="searchInput"
      placeholder="Search premium products..."
      onkeyup="searchProducts()"
    />

    <button class="cart-btn" onclick="toggleCart()">
      🛒 Cart <span id="cartCount">0</span>
    </button>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero">
    <h2>Premium Shopping Experience</h2>
    <p>AI-powered recommendations • Smooth UI • Modern Cart</p>
    <button class="hero-btn">Shop Now</button>
  </section>

  <!-- PRODUCT GRID -->
  <main>
    <h2 class="title">🔥 Featured Products</h2>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <!-- CART PANEL -->
  <div class="cart-panel" id="cartPanel">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <h3>Total: ₹<span id="totalPrice">0</span></h3>
    <button class="checkout-btn">Proceed Checkout</button>
  </div>

  <!-- AI CHATBOT -->
  <div class="chatbot">
    <div class="chat-header">🤖 AI Assistant</div>

    <div class="chat-body" id="chatBody">
      <div class="bot-msg">Hi Pavan 👋 Ask me what you want to buy!</div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type here..." />
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
